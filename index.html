<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recovery Safety Net</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded bg-gray-900 text-white flex items-center justify-center font-bold text-sm">↺</div>
        <div>
          <h1 class="text-base font-bold text-gray-900 leading-tight">Recovery Safety Net</h1>
          <p class="text-xs text-gray-500">AI Vibe Coding Safe Checkpoint & Restore</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-open-save-modal" class="text-xs font-medium bg-gray-100 px-3 py-1.5 rounded border">+ Save Recovery Point</button>
        <button id="btn-nav-checkpoints" class="text-xs font-medium bg-gray-900 text-white px-3 py-1.5 rounded flex items-center space-x-1.5">
          <span>Recent Checkpoints</span>
          <span id="checkpoint-badge" class="bg-gray-700 text-white text-xs px-1.5 py-0.5 rounded-full font-mono">0</span>
        </button>
      </div>
    </div>
  </header>
  <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">
    <div id="status-banner" class="bg-white border-l-4 border-gray-900 p-4 rounded shadow-sm">
      <div class="text-xs uppercase font-semibold text-gray-500">Current Project State</div>
      <div id="current-state-label" class="font-medium text-sm text-gray-900">Working Baseline</div>
    </div>
    <!-- SCREEN 1: PROJECT CANVAS -->
    <section id="screen-project" class="bg-white rounded-lg border border-gray-200 p-6 shadow-sm space-y-6">
      <div class="border-b border-gray-100 pb-4 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-gray-900">Your Project: Story-to-Video Generator</h2>
          <p class="text-xs text-gray-500">Simulate building and testing your app.</p>
        </div>
        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded font-mono">Screen 1</span>
      </div>
      <div class="space-y-4 max-w-xl mx-auto bg-gray-50 p-5 rounded-lg border border-dashed border-gray-300">
        <div>
          <label for="story-input" class="block text-xs font-semibold text-gray-700 uppercase mb-1">Type your story here</label>
          <textarea id="story-input" rows="3" class="w-full text-sm p-3 border border-gray-300 rounded focus:outline-none bg-white">A developer asked an AI assistant to make a minor styling tweak, but the video generator button stopped responding.</textarea>
        </div>
        <div class="flex gap-3">
          <button id="btn-generate-video" class="flex-1 bg-gray-900 text-white font-medium text-sm py-2 px-4 rounded">Generate Video</button>
        </div>
        <div id="video-output-box" class="h-44 bg-gray-900 rounded flex flex-col items-center justify-center text-center p-4 text-white">
          <div id="video-preview-content">Ready for generation</div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
